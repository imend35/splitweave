components:
  schemas:
    ActivityResponse:
      properties:
        id:
          type: string
          title: Id
        kind:
          type: string
          title: Kind
        title:
          type: string
          title: Title
        detail:
          type: string
          title: Detail
        createdAt:
          type: string
          format: date-time
          title: Createdat
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      - title
      - detail
      - createdAt
      title: ActivityResponse
    Currency:
      type: string
      enum:
      - TRY
      - USD
      - EUR
      - GBP
      title: Currency
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - details
      title: ErrorBody
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorEnvelope
    ExpenseCategory:
      type: string
      enum:
      - food_drink
      - groceries
      - transport
      - accommodation
      - utilities
      - entertainment
      - health
      - shopping
      - other
      title: ExpenseCategory
    ExpenseParticipantInput:
      properties:
        memberId:
          type: string
          minLength: 1
          title: Memberid
        inputValue:
          type: string
          maxLength: 30
          minLength: 1
          title: Inputvalue
          default: '1'
        position:
          type: integer
          maximum: 999.0
          minimum: 0.0
          title: Position
      additionalProperties: false
      type: object
      required:
      - memberId
      - position
      title: ExpenseParticipantInput
    ExpenseResponse:
      properties:
        id:
          type: string
          title: Id
        groupId:
          type: string
          title: Groupid
        title:
          type: string
          title: Title
        amount:
          type: string
          title: Amount
        expenseDate:
          type: string
          format: date
          title: Expensedate
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        paidByMemberId:
          type: string
          title: Paidbymemberid
        splitMethod:
          $ref: '#/components/schemas/SplitMethod'
        shares:
          items:
            $ref: '#/components/schemas/ExpenseShareResponse'
          type: array
          title: Shares
        note:
          type: string
          title: Note
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
      additionalProperties: false
      type: object
      required:
      - id
      - groupId
      - title
      - amount
      - expenseDate
      - category
      - paidByMemberId
      - splitMethod
      - shares
      - note
      - createdAt
      - updatedAt
      title: ExpenseResponse
    ExpenseShareResponse:
      properties:
        memberId:
          type: string
          title: Memberid
        inputValue:
          type: string
          title: Inputvalue
        allocatedAmount:
          type: string
          title: Allocatedamount
        position:
          type: integer
          title: Position
      additionalProperties: false
      type: object
      required:
      - memberId
      - inputValue
      - allocatedAmount
      - position
      title: ExpenseShareResponse
    ExpenseWrite:
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 2
